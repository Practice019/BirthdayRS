[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birthdayrs"
version = "0.1.0"
description = "Birthday Reminder System"
readme = "README.md"
requires-python = ">=3.10"
# 运行时核心依赖：任何部署方式都需要（CLI + 定时发送）。
# 桌面 GUI 与 Web 界面的依赖放在 optional-dependencies，避免 Docker / 服务器
# 被 GUI 库拖累 —— pywebview 依赖 pythonnet，那是 Windows 专属的，
# 在 Linux 容器里装不上，而容器里也不需要窗口。
dependencies = [
    "PyYAML>=6.0.0",
    "jinja2>=3.0.0",
    "lunar_python>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiosmtplib>=2.0.0",
    "click",
    "httpx",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
# 桌面应用（Windows / macOS / Linux 桌面），需要系统 WebView2/WKWebView/GTK
desktop = [
    "pywebview>=5.0",
]
# 浏览器管理台（有端口），适合局域网或服务器
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
# 开发与测试
dev = [
    "flake8>=5.0.4",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "psutil>=5.9.0",
]
# 文档
docs = [
    "sphinx>=7.0.0",
    "furo>=2023.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints",
]

[project.scripts]
# 包目录是 src/，不是 birthdayrs/ —— 原来写的 "birthdayrs.main:cli" 指向不存在的模块，
# 安装后执行 `birthdayrs` 会 ModuleNotFoundError。
birthdayrs = "src.main:cli"
