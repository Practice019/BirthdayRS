<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生日提醒</title>
</head>
<body style="margin:0;padding:24px 16px;background:#f6f8fa;font-family:'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;font-size:15px;line-height:1.8;color:#1f2328;">

{# 内容由 build_greeting_lines 生成（与推送同一份），这里只排版。
   改动措辞请去 sender_serverchan，不要在这里另写一套 ——
   那正是邮件与推送内容漂移的根源。 #}
<div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #d0d7de;border-radius:6px;padding:28px 32px;">

  {% for line in greeting_lines %}
    {% if loop.first %}
      <p style="margin:0 0 18px;">{{ line }}</p>
    {% elif loop.last %}
      <p style="margin:18px 0 0;">{{ line }}</p>
    {% else %}
      <p style="margin:0 0 6px;font-size:17px;color:#e91e63;font-weight:600;">{{ line }}</p>
    {% endif %}
  {% endfor %}

</div>

</body>
</html>
