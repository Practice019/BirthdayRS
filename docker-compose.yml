# =============================================================================
# BirthdayRS — Docker Compose
#
# 两种用法：
#
#   1) 每天定时发一次提醒（推荐，最省事）
#      docker compose run --rm birthdayrs
#      然后把这个命令交给宿主机的 cron / 任务计划程序
#
#   2) 常驻 Web 管理台（有端口，适合局域网访问）
#      docker compose --profile web up -d
#      管理台默认要求访问令牌，启动后取地址：
#      docker compose logs birthdayrs-web | grep token
#
# config.yml 用挂载而不是烘进镜像 —— 它含授权码与 API Key。
# 挂的是 ./data 整个**目录**（配置放 data/config.yml），不是单个文件：
# 单文件挂载会让界面里的写操作失败，详见 web 服务下的注释。
# =============================================================================

services:
  # ---- 一次性任务：跑一次检查就退出（配合宿主机 cron）----
  birthdayrs:
    build: .
    image: birthdayrs:latest
    container_name: birthdayrs
    # 时区决定"今天"的判断，必须与使用者所在时区一致
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 挂目录，理由见下面 web 服务的说明（单文件挂载会挡住原子写）
      - ./data:/app/data
    working_dir: /app/data
    command: ["run", "--config", "/app/data/config.yml"]
    restart: "no"

  # ---- 常驻 Web 管理台（可选，需 --profile web 才启动）----
  birthdayrs-web:
    build:
      context: .
      args:
        # Web 命令需要 fastapi/uvicorn，用构建参数装上
        INSTALL_WEB: "1"
    image: birthdayrs:web
    container_name: birthdayrs-web
    profiles: ["web"]
    environment:
      TZ: Asia/Shanghai
      # 固定访问令牌，容器重启后浏览器里的书签与 cookie 不失效。
      # 不设也行 —— 那样每次启动随机生成，用 `docker logs` 取新地址。
      # BIRTHDAYRS_TOKEN: "换成一串你自己的随机字符串"
    volumes:
      # 挂**目录**而不是单个 config.yml 文件。
      # 单文件挂载会让 web 界面的写操作失败：仓储层用「临时文件 + os.replace()」
      # 原子替换（见 src/web/repository.py），而绑定挂载的单文件无法被 rename 覆盖，
      # 会抛 OSError: [Errno 16] Device or resource busy —— 表现为增删收件人一律 500。
      - ./data:/app/data
    # 工作目录设成挂载点：CLI 把日志写在**工作目录**下，这样日志也一起持久化。
    working_dir: /app/data
    command: ["web", "--config", "/app/data/config.yml", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"   # 只绑本机；要对局域网开放改成 "8000:8000"
    restart: unless-stopped
